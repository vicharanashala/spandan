server {
    server_name spandan.fun www.spandan.fun;
    root /var/www/spandan.fun;
    index index.html;

    # API proxy — strip /spandan prefix when forwarding to backend
    location /spandan/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO proxy — WebSocket support with path rewrite
    location /spandan/socket.io/ {
        proxy_pass http://127.0.0.1:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files — fall back to SPA index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /dummy/ {
        alias /var/www/spandan.fun/dummy/;
        index index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/spandan.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spandan.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.spandan.fun) {
        return 301 https://$host$request_uri;
    }
    if ($host = spandan.fun) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name spandan.fun www.spandan.fun;
    return 404;
}