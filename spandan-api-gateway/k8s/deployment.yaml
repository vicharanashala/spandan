apiVersion: apps/v1
kind: Deployment
metadata:
  name: spandan-api-gateway
  namespace: spandan
  labels:
    app: spandan-api-gateway
    component: infrastructure
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: spandan-api-gateway
  template:
    metadata:
      labels:
        app: spandan-api-gateway
        component: infrastructure
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: spandan-api-gateway
      containers:
        - name: gateway
          image: spandan/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: spandan-api-gateway-config
            - secretRef:
                name: spandan-api-gateway-secrets
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseZGC -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - spandan-api-gateway
                topologyKey: kubernetes.io/hostname
