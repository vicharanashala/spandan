apiVersion: v1
kind: Service
metadata:
  name: spandan-api-gateway
  namespace: spandan
  labels:
    app: spandan-api-gateway
    component: infrastructure
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: spandan-api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: spandan-api-gateway-external
  namespace: spandan
  labels:
    app: spandan-api-gateway
    component: infrastructure
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: spandan-api-gateway
