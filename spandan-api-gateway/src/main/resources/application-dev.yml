server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          metadata:
            response-timeout: 10000

        - id: polling-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/polling/**
          metadata:
            response-timeout: 30000

        - id: analytics-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/analytics/**
          metadata:
            response-timeout: 60000

        - id: transcription-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/transcripts/**
          metadata:
            response-timeout: 10000

        - id: question-generation-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/question-generation/**
          metadata:
            response-timeout: 30000

        - id: question-review-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/reviews/**
          metadata:
            response-timeout: 10000

        - id: notification-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/notifications/**
            - Path=/api/v1/notification-preferences/**
          metadata:
            response-timeout: 10000

        - id: recording-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/streams/**
            - Path=/api/v1/recordings/**
          metadata:
            response-timeout: 30000

        - id: response-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/interactions/**
          metadata:
            response-timeout: 10000

        - id: reporting-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/v1/reports/**
          metadata:
            response-timeout: 30000

        - id: admin-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/admin/**
          metadata:
            response-timeout: 10000

        - id: users-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/v1/users/**
          metadata:
            response-timeout: 10000

        - id: real-time-gateway-websocket
          uri: ws://localhost:8090
          predicates:
            - Path=/ws/**

jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LXdoaWNoLW11c3QtYmUtcmVwbGFjZWQtaW4tcHJvZHVjdGlvbi0tCg==}

logging:
  level:
    com.spandan.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"