server:
  port: 8087
  servlet:
    context-path: /

spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USER:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      properties:
        spring.json.trusted.packages: "*"

kafka:
  consumer:
    group-id: notification-service
  topics:
    question-generation-events: question-generation-events
    question-review-events: question-review-events
    polling-events: polling-events
    analytics-events: analytics-events
    transcription-events: transcription-events
    notification-events: notification-events
    user-events: user-events
    lecture-events: lecture-events
    grading-events: grading-events
    session-analytics-events: session-analytics-events

auth:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production}

notification:
  retry:
    interval-ms: 30000
    max-retries: 5

fcm:
  credentials-path: ${FCM_CREDENTIALS_PATH:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    com.spandan.notification: INFO
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
