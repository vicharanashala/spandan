server:
  port: 8084

spring:
  application:
    name: response-service
  datasource:
    url: ${RESPONSE_DB_URL:jdbc:postgresql://localhost:5432/response_db}
    username: ${RESPONSE_DB_USER:postgres}
    password: ${RESPONSE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: response-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.spandan.*
        spring.json.value.default.type: java.lang.Object
      enable-auto-commit: false
      auto-offset-reset: latest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    listener:
      ack-mode: manual
      concurrency: 3

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

interaction-events:
  topic: ${INTERACTION_EVENTS_TOPIC:interaction-events}

response-events:
  topic: ${RESPONSE_EVENTS_TOPIC:response-events}

question-generation:
  events:
    topic: ${QG_EVENTS_TOPIC:question-generation-events}

response:
  correctness:
    defer-on-missing-metadata: true
